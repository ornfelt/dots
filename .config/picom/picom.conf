# picom v12 config (Debian package)
# Reference: man picom, https://picom.app
# Previous version: backup/picom.conf.2026-09-24.bak

#################################
#            Backend            #
#################################

backend = "glx";
vsync = true;
log-level = "warn";

# Stop compositing fullscreen windows (games, video) for lower latency.
# Uncomment if you get tearing/stutter in fullscreen apps.
# unredir-if-possible = true;

#################################
#            Shadows            #
#################################

shadow = false;
shadow-radius = 12;
shadow-opacity = 0.15;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@"
];

#################################
#            Fading             #
#################################

# Open/close fading is handled by the animations below.
fading = false;

#################################
#           Opacity             #
#################################

# inactive-opacity = 0.9;
# false: inactive windows keep their opacity-rule / picom-trans value.
inactive-opacity-override = false;
detect-client-opacity = true;
mark-wmwin-focused = false;

opacity-rule = [
  "80:class_g = 'Spotify'",
  "80:class_g = 'discord'",
  "91:class_g = 'St'",
  "91:class_g = 'URxvt'",
  "91:class_g = 'org.wezfurlong.wezterm'",
  "91:class_g = 'Alacritty'",
  "85:class_g = 'Org.gnome.Nautilus'",
  "90:class_g = 'Thunar'"
];

#################################
#             Blur              #
#################################

# blur-background = true;
# blur: { method = "dual_kawase"; strength = 5; };
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"
];

#################################
#           Corners             #
#################################

# Set to e.g. 10 for Hyprland-style rounded corners.
corner-radius = 0;
detect-rounded-corners = true;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'dwm'",
  "class_g = 'awesome'",
  "class_g = 'dmenu'",
  "class_g = 'Rofi'",
  "class_g = 'Polybar'"
];

#################################
#          Window types         #
#################################

wintypes:
{
  tooltip = { shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.8; };
  dropdown_menu = { opacity = 0.8; };
};

#################################
#          Animations           #
#################################
#
# Hyprland-like: windows pop in from 85% scale with a slight overshoot,
# shrink + fade out on close, and glide when moved/resized.
# Curves are Hyprland's defaults:
#   bezier = myBezier, 0.05, 0.9, 0.1, 1.05   (open, move)
#   plus a quick ease-in for closing.
# Remember: a minus sign in an expression needs spaces around it ("a - b").

animations = (
  # Open: pop in (scale 0.85 -> 1, from the window's centre) + fade in
  {
    triggers = [ "open", "show" ];
    opacity = {
      curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
      duration = 0.2;
      start = 0;
      end = "window-raw-opacity";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = {
      curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)";
      duration = 0.3;
      start = 0.85;
      end = 1;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },

  # Close: shrink to 85% + fade out
  {
    triggers = [ "close", "hide" ];
    opacity = {
      curve = "cubic-bezier(0.4, 0, 1, 1)";
      duration = 0.15;
      start = "window-raw-opacity-before";
      end = 0;
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = {
      curve = "cubic-bezier(0.4, 0, 1, 1)";
      duration = 0.15;
      start = 1;
      end = 0.85;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },

  # Opacity changes (focus change, picom-trans keybinds): smooth transition
  {
    triggers = [ "increase-opacity", "decrease-opacity" ];
    opacity = {
      curve = "linear";
      duration = 0.15;
      start = "window-raw-opacity-before";
      end = "window-raw-opacity";
    };
  },

  # Move (tiling layout changes, tag switches in dwm): glide to the new position.
  # Position only: animating the size too means stretching the old window
  # contents (saved-image-blend), which shows scaled-up text in terminals.
  # EXPERIMENTAL in picom. Delete this block if you see artifacts.
  {
    triggers = [ "geometry" ];
    offset-x = {
      curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)";
      duration = 0.25;
      start = "window-x-before - window-x";
      end = 0;
    };
    offset-y = {
      curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)";
      duration = 0.25;
      start = "window-y-before - window-y";
      end = 0;
    };
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  }
);
